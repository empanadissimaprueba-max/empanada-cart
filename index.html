<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menú de pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">🛒</div>
      <div>
        <div class="title">Haz tu pedido</div>
        <div class="subtitle">Elige productos, selecciona cantidades y envía.</div>
      </div>
    </div>

    <button id="toggleCartBtn" class="btn ghost" type="button" aria-controls="cartPanel" aria-expanded="false">
      <span class="btnIcon">🧾</span>
      <span>Carro</span>
      <span id="cartCountBadge" class="badge" aria-label="Cart item count">0</span>
    </button>
  </header>

  <main class="layout">
    <section class="products" aria-label="Productos">
      <div class="sectionHeader">
        <h2>Productos</h2>
      </div>
      
      <!-- Category selector goes HERE -->
      <div class="categoryBar" role="tablist" aria-label="Categorías">
        <button class="catTab isActive" type="button" role="tab" aria-selected="true" data-cat="Tradicional">Tradicional</button>
        <button class="catTab" type="button" role="tab" aria-selected="false" data-cat="Otros">Otros</button>
        <button class="catTab" type="button" role="tab" aria-selected="false" data-cat="Midi">Midi</button>
        <button class="catTab" type="button" role="tab" aria-selected="false" data-cat="Cóctel">Cóctel</button>
      </div>
      
      <div id="productGrid" class="grid" aria-live="polite"></div>
    </section>

    <aside id="cartPanel" class="cart" aria-label="Cart">
      <div class="cartHeader">
        <h2>Tu pedido</h2>
        <button id="clearCartBtn" class="btn ghost small" type="button">Limpiar pedido</button>
      </div>

      <div id="cartItems" class="cartItems"></div>

      <div class="totals">
        <div class="row">
          <span>Subtotal</span>
          <strong id="subtotal">0</strong>
        </div>
        <div class="row muted small">
          <span>Total</span>
          <strong id="total">0</strong>
        </div>
      </div>

      <form id="checkoutForm" class="checkout" autocomplete="on">
        <h3>Datos envío</h3>
        
        <label class="field">
          <span>Cliente</span>
          <input
            id="customerName"
            name="name"
            type="text"
            maxlength="78"
            placeholder="Escribe tu nombre o el de tu negocio"
            autocomplete="name"
            required
            />
          <small id="nameCounter" class="note-counter">0 / 78</small>
        </label>
        
        <label class="field">
          <span>Número celular</span>
          <input
            id="customerPhone"
            name="phone"
            type="tel"
            autocomplete="tel"
            inputmode="tel"
            placeholder="Formato aceptado: 56912345678"
            required
            />
        </label>

        
        <label class="field">
          <span>Correo electrónico</span>
          <input
            id="customerEmail"
            name="email"
            type="email"
            placeholder="ejemplo@correo.cl"
            autocomplete="email"
            inputmode="email"
            maxlength="254"
            required
            />
        </label>

        
        <label class="field">
          <span>Dirección de envío</span>
          <input
            id="customerAddress"
            name="address"
            type="text"
            maxlength="78"
            placeholder="Calle, número, ciudad/comuna..."
            autocomplete="street-address"
            required
            />
          <small id="addressCounter" class="note-counter">0 / 78</small>
        </label>



        <label class="field">
          <span>Observación (opcional)</span>
          <textarea
            id="customerNote"
            name="note"
            placeholder="¿Algo que debamos saber?"
            maxlength="200"
            rows="3"
          ></textarea>

          <small id="noteCounter" class="note-counter">0 / 200</small>
        </label>
        
        <button id="submitOrderBtn" class="btn primary" type="submit">
          <span class="btnIcon">✅</span>
          <span>Enviar pedido</span>
        </button>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </aside>
  </main>

  <footer class="footer">
  </footer>

  <script src="app.js"></script>
</body>
</html>
